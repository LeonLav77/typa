<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>typing</title>
    <meta name="description" content="A fast, keyboard-only typing test." />
    <link rel="stylesheet" href="/static/style.css" />
    <script type="module" src="/static/main.js"></script>
  </head>
  <body>
    <main class="app" x-data="typing" x-cloak>
      <header class="bar">
        <span class="mark">typing</span>
        <div class="meters" :class="phase === 'running' && 'on'">
          <span class="meter"><b x-text="progress"></b> words</span>
          <span class="meter"><b x-text="elapsed"></b>s</span>
          <span class="meter"><b x-text="live.wpm"></b> wpm</span>
        </div>
      </header>

      <section class="stage">
        <div class="viewport" :class="phase === 'done' && 'hidden'">
          <div class="scroller">
            <div class="text" x-ref="text" data-test-id="{{ .ID }}">{{ range $i, $chars := .Chars }}{{ if $i }} {{ end }}<span class="word" data-i="{{ $i }}">{{ range $c := $chars }}<span class="char">{{ $c }}</span>{{ end }}</span>{{ end }}</div>
            <div class="caret" x-ref="caret" :class="phase === 'idle' && 'blink'"></div>
          </div>
        </div>

        <div class="result" x-show="phase === 'done'">
          <div class="headline">
            <span class="big" x-text="result?.wpm"></span>
            <span class="unit">wpm</span>
          </div>
          <dl class="grid">
            <div><dt>accuracy</dt><dd x-text="result?.accuracy + '%'"></dd></div>
            <div><dt>raw</dt><dd x-text="result?.raw"></dd></div>
            <div><dt>time</dt><dd x-text="result?.seconds.toFixed(1) + 's'"></dd></div>
            <div><dt>clean words</dt><dd><span x-text="result?.wordsRight"></span>/<span x-text="result?.words"></span></dd></div>
          </dl>
          <p class="again">press <kbd>enter</kbd> for a new test</p>
        </div>
      </section>

      <footer class="hints">
        <span><kbd>space</kbd> next word</span>
        <span><kbd>esc</kbd> new text</span>
        <span><kbd>shift</kbd>+<kbd>⌫</kbd> clear word</span>
      </footer>
    </main>
  </body>
</html>
